name: Release Browser Extensions
run-name: Release ${{ github.event.inputs.browser }} extension(s) v${{ github.event.inputs.version }}

# Manual release of the Chrome and/or Firefox extensions from the shared source in
# extensions/. Pick the target with the `browser` input (all by default).
#
# Three jobs:
#   prepare  - compute the browser matrix and fail early if a tag already exists
#   release  - (matrix, parallel) bump the version in the checkout (not committed),
#              assemble a production build (localhost stripped) and package it
#              (Chrome zip / Firefox Mozilla-signed .xpi), then upload both the
#              package and the bumped manifest.
#   finalize - only if every release job succeeded: restore the bumped manifest(s),
#              make one commit, and push the tags (ext-<browser>-v<version>).
# Committing/tagging last means a failed release leaves no dangling tag.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Extension version to build (e.g. 1.0.0)'
        required: true
        type: string
      browser:
        description: 'Which browser(s) to release'
        required: true
        type: choice
        default: all
        options:
          - all
          - chrome
          - firefox

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      browsers: ${{ steps.matrix.outputs.browsers }}
    steps:
      - name: Compute matrix and check tags are free
        id: matrix
        env:
          VERSION: ${{ github.event.inputs.version }}
          BROWSER: ${{ github.event.inputs.browser }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          browsers=()
          if [ "$BROWSER" = "chrome" ]  || [ "$BROWSER" = "all" ]; then browsers+=(chrome); fi
          if [ "$BROWSER" = "firefox" ] || [ "$BROWSER" = "all" ]; then browsers+=(firefox); fi

          for b in "${browsers[@]}"; do
            tag="ext-${b}-v${VERSION}"
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" >/dev/null 2>&1; then
              echo "::error::Tag ${tag} already exists"
              exit 1
            fi
          done

          json=$(printf '%s\n' "${browsers[@]}" | jq -R . | jq -cs .)
          echo "browsers=${json}" >> "$GITHUB_OUTPUT"
          echo "Selected: ${browsers[*]}"

  release:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.prepare.outputs.browsers) }}
    env:
      WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
      WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: extensions

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build and package ${{ matrix.browser }}
        run: |
          make -C extensions bump-${{ matrix.browser }} VERSION="${{ github.event.inputs.version }}"
          make -C extensions package-${{ matrix.browser }}

      - name: Upload ${{ matrix.browser }} package
        uses: actions/upload-artifact@v7
        with:
          name: teamgoujon-${{ matrix.browser }}-extension-${{ github.event.inputs.version }}
          path: extensions/dist/artifacts/*

      # Shared with finalize so it can commit the exact bumped manifest.
      - name: Upload ${{ matrix.browser }} bumped manifest
        uses: actions/upload-artifact@v7
        with:
          name: manifest-${{ matrix.browser }}
          path: extensions/${{ matrix.browser }}/manifest.json

      # --- Phase 2 (Chrome): automatic publish to the Chrome Web Store (unlisted) ---
      # Enable once the CWS developer account and API credentials exist.
      # Add these repo secrets (Settings -> Secrets and variables -> Actions):
      #   CWS_EXTENSION_ID, CWS_CLIENT_ID, CWS_CLIENT_SECRET, CWS_REFRESH_TOKEN
      # See: https://github.com/mnao305/chrome-extension-upload
      #
      # - name: Publish to Chrome Web Store
      #   if: ${{ matrix.browser == 'chrome' }}
      #   uses: mnao305/chrome-extension-upload@v5.0.0
      #   with:
      #     file-path: extensions/dist/artifacts/chrome.zip
      #     extension-id: ${{ secrets.CWS_EXTENSION_ID }}
      #     client-id: ${{ secrets.CWS_CLIENT_ID }}
      #     client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
      #     refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
      #     publish: true

  finalize:
    needs: release
    runs-on: ubuntu-latest
    steps:
      # Authenticate as the Team Goujon GitHub App
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: extensions

      - name: Restore chrome bumped manifest
        if: ${{ github.event.inputs.browser == 'chrome' || github.event.inputs.browser == 'all' }}
        uses: actions/download-artifact@v8
        with:
          name: manifest-chrome
          path: extensions/chrome

      - name: Restore firefox bumped manifest
        if: ${{ github.event.inputs.browser == 'firefox' || github.event.inputs.browser == 'all' }}
        uses: actions/download-artifact@v8
        with:
          name: manifest-firefox
          path: extensions/firefox

      - name: Commit and tag
        env:
          VERSION: ${{ github.event.inputs.version }}
          BROWSER: ${{ github.event.inputs.browser }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          set -euo pipefail

          bumped=""
          tags=()
          stage() {
            local browser="$1"
            git add "extensions/${browser}/manifest.json"
            bumped="${bumped:+$bumped, }${browser}"
            tags+=("ext-${browser}-v${VERSION}")
          }

          if [ "$BROWSER" = "chrome" ]  || [ "$BROWSER" = "all" ]; then stage chrome; fi
          if [ "$BROWSER" = "firefox" ] || [ "$BROWSER" = "all" ]; then stage firefox; fi

          BOT_NAME="${APP_SLUG}[bot]"
          BOT_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          git config user.name "$BOT_NAME"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

          git commit -m "Bump ${bumped} extension(s) to v${VERSION} [skip ci]"
          git push origin HEAD
          for t in "${tags[@]}"; do git tag "$t"; git push origin "$t"; done
