{% extends "base.html" %}
{% block title %}Main menu{% endblock %}
{% block content %}
  <div class="dz-card m-3 p-4">
    <div class="d-grid gap-4 col-10 col-md-8 mx-auto">

      <div>
        <a class="btn btn-lg btn-primary w-100 py-3 fs-5" href="{{ url_for('playlist_parameters') }}">
          <i class="bi bi-music-note-list me-2"></i>New playlist
        </a>
        <p class="text-white-50 small mt-2 mb-0 text-center">Generate a fresh playlist from your favorite artists or Deezer Flow</p>
      </div>

      <div>
        <a class="btn btn-lg btn-secondary w-100 py-3 fs-5" href="{{ url_for('playlists_to_edit') }}">
          <i class="bi bi-pencil-square me-2"></i>Edit existing playlist
        </a>
        <p class="text-white-50 small mt-2 mb-0 text-center">Load one of your Deezer playlists and update its tracks</p>
      </div>

    </div>
  </div>

  <div class="row align-items-center m-3">
    <div class="col text-center">
      <a class="btn btn-danger" href="{{ url_for('logout') }}"><i class="bi bi-box-arrow-right me-1"></i>Logout</a>
    </div>
  </div>
{% endblock %}
